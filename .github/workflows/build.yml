name: Build exe Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m unittest test_calcoli
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name GestoreGiftCardBambu app.py
      - uses: actions/upload-artifact@v4
        with:
          name: GestoreGiftCardBambu
          path: dist/GestoreGiftCardBambu.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GestoreGiftCardBambu.exe
